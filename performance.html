<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<title>資金帳戶績效</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#152033; --muted:#5a667a; --line:#dde2ea; --soft:#eaeef4;
  --accent:#2c3e78; --accent-ink:#ffffff;
  --up:#c62b3d; --up-bg:#fbe9eb; --down:#12805c; --down-bg:#e4f4ee; --warn:#a86a00; --warn-bg:#fbf0d9;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","PMingLiU",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#161d28; --ink:#e5eaf2; --muted:#93a0b5; --line:#263041; --soft:#1e2735;
    --accent:#9db0ff; --accent-ink:#0e131b;
    --up:#ff6f7d; --up-bg:#3a1c22; --down:#3ccf95; --down-bg:#123328; --warn:#f0b64a; --warn-bg:#382a10;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --ink:#e5eaf2; --muted:#93a0b5; --line:#263041; --soft:#1e2735;
  --accent:#9db0ff; --accent-ink:#0e131b;
  --up:#ff6f7d; --up-bg:#3a1c22; --down:#3ccf95; --down-bg:#123328; --warn:#f0b64a; --warn-bg:#382a10;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

header.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:14px}
h1{font-family:var(--f-disp);font-size:28px;margin:0;letter-spacing:.02em}
.stamp{color:var(--muted);font-size:12.5px}
.stamp b{color:var(--ink);font-weight:500}
.back{font-size:12.5px}

.strip{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.stat{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:500;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--muted)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.box h2{margin:0 0 4px;font-size:15px}
.box .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.tbl.scroll{max-height:min(60vh,560px);overflow:auto;overscroll-behavior:contain}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);position:sticky;top:0;z-index:2}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td .nm{font-weight:500} td .cd{color:var(--muted);font-size:12px;margin-right:6px}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.tbl th:first-child{background:var(--soft);z-index:3}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink)}
.tag.st-hit{background:var(--up-bg);color:var(--up)} .tag.st-stop{background:var(--down-bg);color:var(--down)}
.tag.st-run{background:var(--soft)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}

svg text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.axis{stroke:var(--line)}

.skipwrap{display:flex;flex-wrap:wrap;gap:6px}
.skip{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}

.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--f-body);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:0 0 auto}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.foot{margin-top:24px;color:var(--muted);font-size:12px}
</style>

<div class="wrap">
  <header class="mast">
    <h1>資金帳戶績效</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="strip" id="strip"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-t="open" aria-selected="true">持有中<span id="c-open"></span></button>
    <button class="tab" role="tab" data-t="realized" aria-selected="false">已實現交易<span id="c-real"></span></button>
    <button class="tab" role="tab" data-t="cash" aria-selected="false">現金事件</button>
    <button class="tab" role="tab" data-t="skipped" aria-selected="false">資金不足未進場<span id="c-skip"></span></button>
    <button class="tab" role="tab" data-t="newsskip" aria-selected="false">新聞過負面未進場<span id="c-newsskip"></span></button>
    <button class="tab" role="tab" data-t="expired" aria-selected="false">盤中逾期未進場<span id="c-expired"></span></button>
  </nav>

  <section id="p-open"></section>
  <section id="p-realized" hidden></section>
  <section id="p-cash" hidden></section>
  <section id="p-skipped" hidden></section>
  <section id="p-newsskip" hidden></section>
  <section id="p-expired" hidden></section>

  <p class="foot" id="foot"></p>
</div>

<script>
const D = {"meta": {"stockDate": "2026-09-22", "generated": "2026-09-22 22:49", "totalCapital": 2000000, "capitalPerStock": 100000, "cash": 1219208, "nav": 1994506, "sentimentSkipThreshold": -2}, "ledger": [{"股票代碼": "2376", "股票名稱": "技嘉", "候選日期": "2026-09-21", "進場狀態": "已進場", "進場日期": "2026-09-21", "進場價": 368.0, "股數": 353, "投入金額": 129904, "買進手續費": 185, "出場狀態": "持有中", "出場日期": null, "出場價": 366.5, "賣出手續費": 184, "證交稅": 388, "淨損益": -1286, "淨報酬(%)": -0.99, "新聞情緒分數": 4, "新聞情緒動作": "偏正面加碼"}, {"股票代碼": "2436", "股票名稱": "偉詮電", "候選日期": "2026-09-21", "進場狀態": "已進場", "進場日期": "2026-09-21", "進場價": 70.0, "股數": 1857, "投入金額": 129990, "買進手續費": 185, "出場狀態": "持有中", "出場日期": null, "出場價": 71.0, "賣出手續費": 188, "證交稅": 396, "淨損益": 1088, "淨報酬(%)": 0.84, "新聞情緒分數": 4, "新聞情緒動作": "偏正面加碼"}, {"股票代碼": "3044", "股票名稱": "健鼎", "候選日期": "2026-09-21", "進場狀態": "已進場", "進場日期": "2026-09-21", "進場價": 524.0, "股數": 248, "投入金額": 129952, "買進手續費": 185, "出場狀態": "持有中", "出場日期": null, "出場價": 539.0, "賣出手續費": 190, "證交稅": 401, "淨損益": 2944, "淨報酬(%)": 2.27, "新聞情緒分數": 3, "新聞情緒動作": "偏正面加碼"}, {"股票代碼": "3312", "股票名稱": "弘憶股", "候選日期": "2026-09-21", "進場狀態": "已進場", "進場日期": "2026-09-21", "進場價": 54.7, "股數": 2376, "投入金額": 129967, "買進手續費": 185, "出場狀態": "持有中", "出場日期": null, "出場價": 55.0, "賣出手續費": 186, "證交稅": 392, "淨損益": -50, "淨報酬(%)": -0.04, "新聞情緒分數": 3, "新聞情緒動作": "偏正面加碼"}, {"股票代碼": "3701", "股票名稱": "大眾控", "候選日期": "2026-09-21", "進場狀態": "已進場", "進場日期": "2026-09-21", "進場價": 42.7, "股數": 3044, "投入金額": 129979, "買進手續費": 185, "出場狀態": "持有中", "出場日期": null, "出場價": 41.6, "賣出手續費": 180, "證交稅": 380, "淨損益": -4093, "淨報酬(%)": -3.15, "新聞情緒分數": 1, "新聞情緒動作": "偏正面加碼"}, {"股票代碼": "6672", "股票名稱": "騰輝電子-KY", "候選日期": "2026-09-21", "進場狀態": "已進場", "進場日期": "2026-09-21", "進場價": 310.0, "股數": 419, "投入金額": 129890, "買進手續費": 185, "出場狀態": "持有中", "出場日期": null, "出場價": 302.0, "賣出手續費": 180, "證交稅": 380, "淨損益": -4097, "淨報酬(%)": -3.15, "新聞情緒分數": 3, "新聞情緒動作": "偏正面加碼"}], "events": [{"日期": "2026-09-21", "現金變化": -130089, "說明": "進場 2376 技嘉 353股 (偏正面加碼)", "事件後現金": 1869911}, {"日期": "2026-09-21", "現金變化": -130175, "說明": "進場 2436 偉詮電 1857股 (偏正面加碼)", "事件後現金": 1739736}, {"日期": "2026-09-21", "現金變化": -130137, "說明": "進場 3044 健鼎 248股 (偏正面加碼)", "事件後現金": 1609599}, {"日期": "2026-09-21", "現金變化": -130152, "說明": "進場 3312 弘憶股 2376股 (偏正面加碼)", "事件後現金": 1479447}, {"日期": "2026-09-21", "現金變化": -130164, "說明": "進場 3701 大眾控 3044股 (偏正面加碼)", "事件後現金": 1349283}, {"日期": "2026-09-21", "現金變化": -130075, "說明": "進場 6672 騰輝電子-KY 419股 (偏正面加碼)", "事件後現金": 1219208}]};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, d=2) => v == null ? "–" : Number(v).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const money = v => v == null ? "–" : (v > 0 ? "+" : "") + Math.round(v).toLocaleString("en-US");
const sgn = v => v == null ? "" : (v > 0 ? "up" : v < 0 ? "down" : "");
const pct = (v, d=2) => v == null ? "–" : (v > 0 ? "+" : "") + fmt(v, d) + "%";
const sentTag = r => {
  const a = r["新聞情緒動作"];
  if (!a) return "–";
  const cls = a === "偏正面加碼" ? "st-hit" : a === "偏負面減碼" ? "st-stop" : "";
  const suffix = a.includes("盤中低點進場") ? "" : ` (${r["新聞情緒分數"]})`;
  return `<span class="tag ${cls}">${esc(a)}${suffix}</span>`;
};

const L = D.ledger, E = D.events;
const entered = L.filter(r => r["進場狀態"] === "已進場");
const openPos = entered.filter(r => r["出場狀態"] === "持有中");
const realized = entered.filter(r => r["出場狀態"] !== "持有中");
const skipped = L.filter(r => r["進場狀態"] === "資金不足未進場");
const newsSkipped = L.filter(r => r["進場狀態"] === "新聞過負面未進場");
const expired = L.filter(r => r["進場狀態"] === "盤中逾期未進場");
const boosted = entered.filter(r => r["新聞情緒動作"] === "偏正面加碼");
const cutSized = entered.filter(r => r["新聞情緒動作"] === "偏負面減碼");
const win = realized.filter(r => r["淨損益"] > 0).length;

$("#stamp").innerHTML = `每筆投入 <b class="num">${D.meta.capitalPerStock.toLocaleString("en-US")}</b> 元 · 總資金 <b class="num">${D.meta.totalCapital.toLocaleString("en-US")}</b> 元 · 資料日期 <b class="num">${esc(D.meta.stockDate)}</b> · 頁面產生 <span class="num">${esc(D.meta.generated)}</span>`;

$("#strip").innerHTML = [
  ["現金", money(D.meta.cash) + " 元", ""],
  ["持有中", openPos.length + " 檔", `未實現 ${money(openPos.reduce((a,r)=>a+(r["淨損益"]||0),0))} 元`],
  ["淨值(NAV)", money(D.meta.nav) + " 元", pct((D.meta.nav / D.meta.totalCapital - 1) * 100)],
  ["已實現損益", money(realized.reduce((a,r)=>a+(r["淨損益"]||0),0)) + " 元", `${realized.length} 筆`],
  ["已實現勝率", realized.length ? fmt(win/realized.length*100,1)+"%" : "–", `${win}/${realized.length} 筆獲利`],
  ["新聞情緒調整", `${boosted.length}加碼 / ${cutSized.length}減碼`, "免費關鍵字版，準確度有限"],
  ["資金不足未進場", skipped.length + " 筆", "累計"],
  ["新聞過負面未進場", newsSkipped.length + " 筆", "累計"],
  ["盤中逾期未進場", expired.length + " 筆", "累計"],
].map(([k,v,n]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join("");
$("#c-open").textContent = " " + openPos.length; $("#c-real").textContent = " " + realized.length;
$("#c-skip").textContent = " " + skipped.length; $("#c-newsskip").textContent = " " + newsSkipped.length;
$("#c-expired").textContent = " " + expired.length;

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  ["open","realized","cash","skipped","newsskip","expired"].forEach(t => $("#p-"+t).hidden = t !== b.dataset.t);
}));

function table(cols, rows, scroll) {
  return `<div class="tbl${scroll ? " scroll" : ""}"><table><thead><tr>${cols.map(c=>`<th class="${c.l?"l":""}">${c.h}</th>`).join("")}</tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.l?"l":""}">${c.r(r)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cols.length}" class="l"><span class="hint">沒有資料。</span></td></tr>`}</tbody></table></div>`;
}

$("#p-open").innerHTML = `<div class="box"><h2>持有中的部位</h2><p class="sub">依目前價估算的未實現損益，已扣除假設今天出場的手續費與證交稅。</p>` +
  table([
    {h:"股票", l:1, r:r=>`<span class="cd num">${esc(r["股票代碼"])}</span><span class="nm">${esc(r["股票名稱"])}</span>`},
    {h:"進場日", l:1, r:r=>`<span class="num">${esc(r["進場日期"])}</span>`},
    {h:"進場價", r:r=>`<span class="num">${fmt(r["進場價"])}</span>`},
    {h:"股數", r:r=>`<span class="num">${fmt(r["股數"],0)}</span>`},
    {h:"投入金額", r:r=>`<span class="num">${fmt(r["投入金額"],0)}</span>`},
    {h:"目前價", r:r=>`<span class="num">${fmt(r["出場價"])}</span>`},
    {h:"未實現損益", r:r=>`<span class="num ${sgn(r["淨損益"])}">${money(r["淨損益"])}</span>`},
    {h:"淨報酬", r:r=>`<span class="num ${sgn(r["淨報酬(%)"])}">${pct(r["淨報酬(%)"])}</span>`},
    {h:"新聞情緒", l:1, r:sentTag},
  ], openPos.sort((a,b)=>(b["淨損益"]||0)-(a["淨損益"]||0)), true) + `</div>`;

$("#p-realized").innerHTML = `<div class="box"><h2>已實現交易</h2><p class="sub">已扣手續費與證交稅的淨損益，結果固定不再變動。</p>` +
  table([
    {h:"股票", l:1, r:r=>`<span class="cd num">${esc(r["股票代碼"])}</span><span class="nm">${esc(r["股票名稱"])}</span>`},
    {h:"進場日", l:1, r:r=>`<span class="num">${esc(r["進場日期"])}</span>`},
    {h:"進場價", r:r=>`<span class="num">${fmt(r["進場價"])}</span>`},
    {h:"股數", r:r=>`<span class="num">${fmt(r["股數"],0)}</span>`},
    {h:"出場日", l:1, r:r=>`<span class="num">${esc(r["出場日期"])}</span>`},
    {h:"出場價", r:r=>`<span class="num">${fmt(r["出場價"])}</span>`},
    {h:"狀態", l:1, r:r=>`<span class="tag ${r["出場狀態"]==="已達壓力"?"st-hit":r["出場狀態"]==="主動換股"?"":"st-stop"}">${esc(r["出場狀態"])}</span>`},
    {h:"淨損益", r:r=>`<span class="num ${sgn(r["淨損益"])}">${money(r["淨損益"])}</span>`},
    {h:"淨報酬", r:r=>`<span class="num ${sgn(r["淨報酬(%)"])}">${pct(r["淨報酬(%)"])}</span>`},
    {h:"新聞情緒", l:1, r:sentTag},
  ], realized.sort((a,b)=>(b["出場日期"]||"").localeCompare(a["出場日期"]||"")), true) + `</div>`;

(function(){
  const W=760,H=220,pl=70,pb=34,pt=14,pr=14;
  const vals = E.map(e=>e["事件後現金"]);
  const mn = Math.min(0, ...vals), mx = Math.max(...vals, 1);
  const x = i => pl + (W-pl-pr) * (E.length>1 ? i/(E.length-1) : 0);
  const y = v => pt + (H-pt-pb) * (1 - (v-mn)/(mx-mn||1));
  const path = E.map((e,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(e["事件後現金"]).toFixed(1)}`).join(" ");
  const ticks=[mn, (mn+mx)/2, mx];
  const svg = E.length ? `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="現金水位事件序列">
    ${ticks.map(t=>{const yy=y(t);return `<line class="axis" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${Math.round(t).toLocaleString("en-US")}</text>`}).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${E.map((e,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(e["事件後現金"]).toFixed(1)}" r="3" fill="var(--accent)"><title>${esc(e["日期"])} ${esc(e["說明"])} 現金:${Math.round(e["事件後現金"]).toLocaleString("en-US")}</title></circle>`).join("")}
  </svg>` : `<p class="hint">目前沒有任何現金事件。</p>`;
  $("#p-cash").innerHTML = `<div class="box"><h2>現金水位</h2><p class="sub">每次進場/出場當下的現金餘額，準確反映資金卡住的過程；這不是完整的每日淨值曲線 (見底部說明)。</p>${svg}</div>` +
    table([
      {h:"日期", l:1, r:r=>`<span class="num">${esc(r["日期"])}</span>`},
      {h:"說明", l:1, r:r=>esc(r["說明"])},
      {h:"現金變化", r:r=>`<span class="num ${sgn(r["現金變化"])}">${money(r["現金變化"])}</span>`},
      {h:"事件後現金", r:r=>`<span class="num">${fmt(r["事件後現金"],0)}</span>`},
    ], [...E].reverse(), true);
})();

$("#p-skipped").innerHTML = `<div class="box"><h2>因資金不足未進場的候選</h2><p class="sub">這些訊號出現時現金不夠買一整筆，直接跳過、不會遞延到之後有錢了才補買。</p>` +
  (skipped.length ? `<div class="skipwrap">${skipped.map(r=>`<span class="skip">${esc(r["候選日期"])} ${esc(r["股票代碼"])} ${esc(r["股票名稱"])}</span>`).join("")}</div>` : `<p class="hint">目前沒有任何候選被跳過。</p>`) + `</div>`;

$("#p-newsskip").innerHTML = `<div class="box"><h2>因新聞過負面未進場的候選</h2><p class="sub">最近新聞的免費關鍵字情緒分數 ≤ ${esc(String(D.meta.sentimentSkipThreshold))} (負面關鍵字明顯多於正面)，即使有現金也不進場。</p>` +
  (newsSkipped.length ? `<div class="skipwrap">${newsSkipped.map(r=>`<span class="skip">${esc(r["候選日期"])} ${esc(r["股票代碼"])} ${esc(r["股票名稱"])} (${r["新聞情緒分數"]})</span>`).join("")}</div>` : `<p class="hint">目前沒有任何候選因新聞過負面被跳過。</p>`) + `</div>`;

$("#p-expired").innerHTML = `<div class="box"><h2>盤中逾期未進場的候選</h2><p class="sub">盤中低點反彈訊號一直沒觸發，等超過設定的交易日數就放棄，不會一直等下去。</p>` +
  (expired.length ? `<div class="skipwrap">${expired.map(r=>`<span class="skip">${esc(r["候選日期"])} ${esc(r["股票代碼"])} ${esc(r["股票名稱"])}</span>`).join("")}</div>` : `<p class="hint">目前沒有任何候選逾期。</p>`) + `</div>`;

$("#foot").innerHTML = `每筆候選預算 ${D.meta.capitalPerStock.toLocaleString("en-US")} 元，先依最近新聞的免費關鍵字情緒分數調整 (正面×1.3加碼、負面×0.7減碼、分數≤${esc(String(D.meta.sentimentSkipThreshold))}不進場)，再算股數 = 調整後預算 ÷ 進場價 (取整數股，不強制湊成一張1000股)，實際投入金額通常比預算略低；含買賣手續費0.1425%、賣出證交稅0.3%。新聞情緒只在候選第一次考慮進場那天查一次並鎖定，是關鍵字比對不是語意理解，準確度有限。同一檔股票已持有中不會重複買進。較新的候選改用「盤中低點反彈」進場：盤中追蹤目前為止的最低價，價格反彈1%才算觸發，不是真的抓到最低點 (那不可能，低點只有事後才能確認)，出場判斷仍沿用部位追蹤既有邏輯，跟盤中進場價可能有微小落差。現金不夠買當天新候選時，允許主動賣掉報酬已經明顯落後 (低於-2%，還沒到-5%停損) 的舊持股換股，一次只換一檔，狀態顯示「主動換股」。系統沒有保留每天的歷史股價，還在持有中的部位無法回推過去某一天的市值，因此只提供「現金水位」事件序列，不是完整的每日淨值曲線。資料來自 每日選股(多) 的「入選且條件≥3且成交量>800張」名單，僅供個人研究參考，非投資建議，不會自動更新 (這是產生當下的快照)。<br>回 <a href="/">選股儀表板</a>`;
</script>
