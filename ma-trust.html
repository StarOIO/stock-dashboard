<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<title>年線投信選股</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#152033; --muted:#5a667a; --line:#dde2ea; --soft:#eaeef4;
  --accent:#2c3e78; --accent-ink:#ffffff;
  --up:#c62b3d; --up-bg:#fbe9eb; --down:#12805c; --down-bg:#e4f4ee; --warn:#a86a00; --warn-bg:#fbf0d9;
  /* 長條圖用的單一色相 (單一數列不需要類別色盤)。亮度/彩度/對比都驗算過:
     L=0.500 在 light 帶 0.43-0.77 內、C=0.121 >= 0.10、對比 6.14:1 >= 3:1 */
  --bar:#4a5da8; --bar-track:#eaeef4;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","PMingLiU",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#161d28; --ink:#e5eaf2; --muted:#93a0b5; --line:#263041; --soft:#1e2735;
    --accent:#9db0ff; --accent-ink:#0e131b;
    --up:#ff6f7d; --up-bg:#3a1c22; --down:#3ccf95; --down-bg:#123328; --warn:#f0b64a; --warn-bg:#382a10;
    /* 深色不是淺色的自動翻轉，是另外挑過再驗算的: L=0.634 在 dark 帶 0.48-0.67 內、
       C=0.157、對比 4.76:1 (底色 #161d28) */
    --bar:#6d80e8; --bar-track:#1e2735;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --ink:#e5eaf2; --muted:#93a0b5; --line:#263041; --soft:#1e2735;
  --accent:#9db0ff; --accent-ink:#0e131b;
  --up:#ff6f7d; --up-bg:#3a1c22; --down:#3ccf95; --down-bg:#123328; --warn:#f0b64a; --warn-bg:#382a10;
  --bar:#6d80e8; --bar-track:#1e2735;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

header.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:14px}
h1{font-family:var(--f-disp);font-size:28px;margin:0;letter-spacing:.02em}
.stamp{color:var(--muted);font-size:12.5px}
.stamp b{color:var(--ink);font-weight:500}
.back{font-size:12.5px}

.strip{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.stat{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:500;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--muted)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.box h2{margin:0 0 10px;font-size:15px}
.rules{margin:0;padding-left:20px}
.rules li{margin-bottom:4px}
.rules b{font-family:var(--f-num)}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0}

/* 產業分布: 水平長條，單一數列所以不需要圖例 (標題已說明是什麼)。
   每條都直接標上檔數，不必靠 hover 才知道數字；hover 另外給完整明細。 */
.chart{display:grid;grid-template-columns:minmax(72px,auto) minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.chart .lab{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .track{background:var(--bar-track);border-radius:4px;height:16px;position:relative}
.chart .fill{background:var(--bar);height:100%;border-radius:0 4px 4px 0;min-width:3px}
.chart .row:hover .fill{filter:brightness(1.12)}
.chart .val{font-family:var(--f-num);font-size:12.5px;color:var(--ink);min-width:2.2em;text-align:right}
.chart .row{display:contents;cursor:default}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 200px;max-width:280px;font:14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.dateselect{font:14px var(--f-num);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);flex:0 0 auto}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13px var(--f-body);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px} th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td .nm{font-weight:500} td .cd{color:var(--muted);font-size:12px;margin-right:6px}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.tbl th:first-child{background:var(--soft);z-index:3}
.foot{margin-top:28px;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 15px var(--f-body);padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:0 0 auto}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .c{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-left:5px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink)}
.tag.st-stop{background:var(--down-bg);color:var(--down)} .tag.st-hit{background:var(--up-bg);color:var(--up)}
@media (max-width:640px){ h1{font-size:23px} .chart{grid-template-columns:minmax(58px,auto) minmax(0,1fr) auto} }
</style>

<div class="wrap">
  <header class="mast">
    <h1>年線投信選股</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <p class="back"><a href="index.html">← 回選股儀表板</a></p>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="list" aria-selected="true">選股清單<span class="c" id="c-list"></span></button>
    <button class="tab" role="tab" data-t="track" aria-selected="false">部位追蹤<span class="c" id="c-track"></span></button>
  </nav>

  <section id="p-list">
  <div class="strip" id="strip"></div>

  <div class="box">
    <h2>選股條件 (三項全部要同時成立)</h2>
    <ol class="rules" id="rules"></ol>
    <p class="note" id="rule-note"></p>
    <p class="note"><b>怎麼看：</b>「距年線%」是股價比年線高多少 —— 數字小表示剛站上年線不久、離支撐近；數字大表示已經漲離年線很遠，續強但追價風險相對高。
      <b>這是條件篩選的結果，不是買進建議。</b></p>
  </div>

  <div class="box">
    <h2 id="chart-title">產業分布</h2>
    <div class="chart" id="chart"></div>
    <p class="note" id="chart-note"></p>
  </div>

  <div class="tools">
    <select class="dateselect" id="date" aria-label="選擇選股日期"></select>
    <select class="dateselect" id="ind" aria-label="選擇產業"></select>
    <input class="search" id="q" type="search" placeholder="搜尋代碼、名稱、產業" aria-label="搜尋">
    <button class="chip" data-m="all" aria-pressed="true">全部</button>
    <button class="chip" data-m="上市" aria-pressed="false">上市</button>
    <button class="chip" data-m="上櫃" aria-pressed="false">上櫃</button>
  </div>
  <div id="table"></div>
  </section>

  <section id="p-track" hidden>
    <div class="strip" id="tstrip"></div>
    <p class="note" id="track-rule"></p>
    <div class="tools">
      <select class="dateselect" id="tDate" aria-label="選擇選股日期"></select>
      <select class="dateselect" id="tInd" aria-label="選擇產業"></select>
      <input class="search" id="tq" type="search" placeholder="搜尋代碼或名稱" aria-label="搜尋">
      <button class="chip" data-s="追蹤中" aria-pressed="true">追蹤中</button>
      <button class="chip" data-s="已跌破支撐" aria-pressed="false">已跌破支撐</button>
      <button class="chip" data-s="已達壓力" aria-pressed="false">已達壓力</button>
    </div>
    <div id="ttable"></div>
    <div class="box" style="margin-top:16px"><h2>依選股日期</h2><div id="tcohort"></div></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

  $("#chart-title").textContent = `產業分布 (共 ${list.length} 檔，${ent.length} 個產業)`;
  $("#chart").innerHTML = ent.length ? ent.map(([k,v]) => {
    const names = list.filter(r => (r["產業別"]||"未分類") === k).map(r => r["股票名稱"]).join("、");
    return `<div class="row" title="${esc(k)}：${v} 檔 — ${esc(names)}">
      <div class="lab">${esc(k)}</div>
      <div class="track"><div class="fill" style="width:${v/max*100}%"></div></div>
      <div class="val">${v}</div></div>`;
  }).join("") : `<p class="hint">沒有符合的股票。</p>`;
  $("#chart-note").textContent = ent.length
    ? `長條長度＝該產業的檔數，最長的是 ${ent[0][0]} ${ent[0][1]} 檔。滑到長條上可看到是哪幾檔。這張圖跟著下面的篩選一起變動。`
    : "";
}

/* ---------- 表格 ---------- */
const cols = [
  {k:"n", h:"股票", l:1, first:1, v:r=>r["股票代碼"], r:r=>`<span class="cd num">${esc(r["股票代碼"])}</span><span class="nm">${esc(r["股票名稱"])}</span> <span class="cd">${esc(r["市場"]||"")}</span>`},
  {k:"ind", h:"產業", l:1, first:1, v:r=>r["產業別"]||"", r:r=>esc(r["產業別"]||"–")},
  {k:"close", h:"收盤", v:r=>r["收盤價"], r:r=>`<span class="num">${fmt(r["收盤價"])}</span>`},
  {k:"chg", h:"漲跌%", v:r=>r["漲跌幅(%)"], r:r=>`<span class="num ${sgn(r["漲跌幅(%)"])}">${pct(r["漲跌幅(%)"])}</span>`},
  {k:"trust", h:"投信買超(張)", v:r=>r["投信買超(張)"], r:r=>`<span class="num up">${fmt(r["投信買超(張)"],1)}</span>`},
  {k:"trusts", h:"投信買超股數", v:r=>r["投信買超股數"], r:r=>`<span class="num">${fmt(r["投信買超股數"],0)}</span>`},
  {k:"vol", h:"成交量(張)", v:r=>r["今日成交量(張)"], r:r=>`<span class="num">${fmt(r["今日成交量(張)"],0)}</span>`},
  {k:"ma", h:"年線", v:r=>r[maCol], r:r=>`<span class="num">${fmt(r[maCol])}</span>`},
  {k:"dev", h:"距年線%", v:r=>r["距年線(%)"], r:r=>`<span class="num ${sgn(r["距年線(%)"])}">${pct(r["距年線(%)"],1)}</span>`},
];
let key = "trust", dir = -1;
function table() {
  const list = [...rows()].sort((a,b) => {
    const c = cols.find(x=>x.k===key), x = c.v(a), y = c.v(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  $("#table").innerHTML = `<div class="tbl"><table><thead><tr>${cols.map(c =>
    `<th class="${c.l?"l":""}" data-k="${c.k}" aria-sort="${c.k===key?(dir>0?"ascending":"descending"):"none"}">${c.h}</th>`).join("")}</tr></thead>
    <tbody>${list.map(r => `<tr>${cols.map(c => `<td class="${c.l?"l":""}">${c.r(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${list.length ? "" : `<p class="hint" style="padding:12px">沒有符合的股票。</p>`}`;
  $("#table").querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k; if (k === key) dir = -dir; else { key = k; dir = cols.find(c=>c.k===k).first || -1; }
    table();
  }));
}

const redraw = () => { chart(); table(); };
$("#q").addEventListener("input", redraw);
$("#ind").addEventListener("change", redraw);
$("#date").addEventListener("change", () => { strip(); fillIndustry(); redraw(); });
document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
  market = b.dataset.m; document.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x===b));
  fillIndustry(); redraw();
}));
strip(); fillIndustry(); redraw();
/* ---------- 分頁 ---------- */
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  ["list","track"].forEach(t => $("#p-"+t).hidden = t !== b.dataset.t);
}));
$("#c-list").textContent = (D.byDate[dates[0]] || []).length;

/* ---------- 部位追蹤 ----------
   這套選股自己的追蹤紀錄 (年線投信追蹤.py 維護)，跟主程式的部位追蹤是兩份
   獨立的檔案。基準價是選股日收盤價，實際最快要隔天才買得到，所以略微樂觀。 */
(function(){
  const T = D.tracking || [];
  $("#c-track").textContent = T.length;
  if (!T.length) {
    $("#p-track").innerHTML = `<p class="hint">還沒有追蹤紀錄。年線投信追蹤.py 跑過之後，這裡會開始累積每天選出來的股票後續表現。</p>`;
    return;
  }
  const R = D.rules || {};
  const num = v => (v == null ? null : Number(v));
  const stCls = s => ({"已跌破支撐":"st-stop","已達壓力":"st-hit"}[s] || "");
  let status = "追蹤中";

  $("#track-rule").innerHTML = `基準價＝<b>選股日收盤價</b>，報酬是從那天收盤算到最近一次更新的收盤。`
    + `出場規則：報酬達 <b>-${R.stopLoss ?? 10}%</b> 結案為「已跌破支撐」`
    + (R.takeProfit == null ? `，<b>目前不停利</b> —— 獲利部位會一直留在追蹤中，只會被停損結案。`
                            : `、達 <b>+${R.takeProfit}%</b> 結案為「已達壓力」。`)
    + `　⚠️ 投信買賣超是收盤後才公布的，實際上最快隔天開盤才買得到，所以這個報酬比真正能執行的結果略微樂觀。`;

  const inStatus = () => T.filter(r => r["追蹤狀態"] === status);
  const rows = () => {
    const q = $("#tq").value.trim().toLowerCase(), d = $("#tDate").value, ind = $("#tInd").value;
    return inStatus().filter(r =>
      (d === "all" || r["選股日期"] === d) &&
      (ind === "all" || (r["產業別"] || "未分類") === ind) &&
      (!q || (r["股票代碼"] + " " + r["股票名稱"]).toLowerCase().includes(q)));
  };

  function strip() {
    const act = T.filter(r => r["追蹤狀態"] === "追蹤中");
    const rr = act.map(r => num(r["目前報酬(%)"])).filter(v => v != null);
    const all = T.map(r => num(r["目前報酬(%)"])).filter(v => v != null);
    $("#tstrip").innerHTML = [
      ["追蹤中", act.length, `共 ${T.length} 筆紀錄`],
      ["追蹤中平均報酬", pct(rr.length ? rr.reduce((a,b)=>a+b,0)/rr.length : null), ""],
      ["追蹤中勝率", rr.length ? fmt(rr.filter(v=>v>0).length/rr.length*100,1)+"%" : "–", ""],
      ["已跌破支撐", T.filter(r=>r["追蹤狀態"]==="已跌破支撐").length, "停損結案"],
      ["全部平均報酬", pct(all.length ? all.reduce((a,b)=>a+b,0)/all.length : null), "含已結案"],
    ].map(([k,v,n]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join("");
  }

  function fillFilters() {
    const base = inStatus(), keepD = $("#tDate").value, keepI = $("#tInd").value;
    const ds = [...new Set(base.map(r => r["選股日期"]))].sort().reverse();
    $("#tDate").innerHTML = `<option value="all">全部日期 (${base.length})</option>`
      + ds.map(d => `<option value="${esc(d)}">${esc(d)} (${base.filter(r=>r["選股日期"]===d).length})</option>`).join("");
    $("#tDate").value = ds.includes(keepD) ? keepD : "all";
    const by = {};
    base.forEach(r => { const k = r["產業別"] || "未分類"; by[k] = (by[k]||0)+1; });
    const ent = Object.entries(by).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
    $("#tInd").innerHTML = `<option value="all">全部產業 (${base.length})</option>`
      + ent.map(([k,v]) => `<option value="${esc(k)}">${esc(k)} (${v})</option>`).join("");
    $("#tInd").value = ent.some(([k]) => k === keepI) ? keepI : "all";
  }

  const tcols = [
    {h:"股票", l:1, v:r=>r["股票代碼"], r:r=>`<span class="cd num">${esc(r["股票代碼"])}</span><span class="nm">${esc(r["股票名稱"])}</span> <span class="cd">${esc(r["市場"]||"")}</span>`},
    {h:"產業", l:1, v:r=>r["產業別"]||"", r:r=>esc(r["產業別"]||"–")},
    {h:"選股日", l:1, v:r=>r["選股日期"], r:r=>`<span class="num">${esc(r["選股日期"])}</span>`},
    {h:"選股價", v:r=>num(r["選股收盤價"]), r:r=>`<span class="num">${fmt(r["選股收盤價"])}</span>`},
    {h:"目前價", v:r=>num(r["目前收盤價"]), r:r=>`<span class="num">${fmt(r["目前收盤價"])}</span>`},
    {h:"報酬", v:r=>num(r["目前報酬(%)"]), r:r=>`<span class="num ${sgn(num(r["目前報酬(%)"]))}">${pct(num(r["目前報酬(%)"]))}</span>`},
    {h:"天數", v:r=>num(r["追蹤天數"]), r:r=>`<span class="num">${r["追蹤天數"]}</span>`},
    {h:"選股時投信(張)", v:r=>num(r["選股時投信買超(張)"]), r:r=>`<span class="num">${fmt(r["選股時投信買超(張)"],0)}</span>`},
    {h:"狀態", l:1, v:r=>r["追蹤狀態"], r:r=>`<span class="tag ${stCls(r["追蹤狀態"])}">${esc(r["追蹤狀態"])}</span>`},
    {h:"最後更新", l:1, v:r=>r["最後更新日期"], r:r=>`<span class="num">${esc(r["最後更新日期"])}</span>`},
  ];
  let tkey = 5, tdir = -1;   // 預設依報酬由大到小
  function ttable() {
    const list = [...rows()].sort((a,b) => {
      const x = tcols[tkey].v(a), y = tcols[tkey].v(b);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * tdir;
    });
    $("#ttable").innerHTML = `<div class="tbl"><table><thead><tr>${tcols.map((c,i) =>
      `<th class="${c.l?"l":""}" data-i="${i}" aria-sort="${i===tkey?(tdir>0?"ascending":"descending"):"none"}">${c.h}</th>`).join("")}</tr></thead>
      <tbody>${list.map(r => `<tr>${tcols.map(c => `<td class="${c.l?"l":""}">${c.r(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
      + (list.length ? "" : `<p class="hint" style="padding:12px">沒有符合的紀錄。</p>`);
    $("#ttable").querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
      const i = +th.dataset.i; if (i === tkey) tdir = -tdir; else { tkey = i; tdir = -1; } ttable();
    }));
  }

  function cohort() {
    const by = {};
    T.forEach(r => (by[r["選股日期"]] ||= []).push(r));
    const rowsHtml = Object.keys(by).sort().reverse().map(d => {
      const a = by[d], v = a.map(r => num(r["目前報酬(%)"])).filter(x => x != null);
      const avg = v.length ? v.reduce((x,y)=>x+y,0)/v.length : null;
      return `<tr><td class="l num">${esc(d)}</td><td class="num">${a.length}</td>
        <td class="num ${sgn(avg)}">${pct(avg)}</td>
        <td class="num">${v.length ? fmt(v.filter(x=>x>0).length/v.length*100,0) : "–"}%</td>
        <td class="num">${a.filter(r=>r["追蹤狀態"]==="追蹤中").length}</td>
        <td class="num">${a.filter(r=>r["追蹤狀態"]==="已跌破支撐").length}</td></tr>`;
    }).join("");
    $("#tcohort").innerHTML = `<div class="tbl"><table style="min-width:420px"><thead><tr>
      <th class="l">選股日</th><th>檔數</th><th>平均報酬</th><th>勝率</th><th>追蹤中</th><th>已停損</th>
      </tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
  }

  const tredraw = () => { fillFilters(); ttable(); };
  $("#tq").addEventListener("input", ttable);
  $("#tDate").addEventListener("change", ttable);
  $("#tInd").addEventListener("change", ttable);
  $("#p-track").querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => {
    status = b.dataset.s;
    $("#p-track").querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", x === b));
    tredraw();
  }));
  strip(); tredraw(); cohort();
})();

$("#foot").textContent = `資料來自 年線投信選股.py：股價與成交量取自 Yahoo 財經 (yfinance)，投信買賣超取自證交所 T86 與櫃買中心。`
  + `僅供個人研究參考，非投資建議。這是產生當下的快照，不會自動更新。`;
</script>

</body>
</html>
