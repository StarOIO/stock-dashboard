<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#152033; --muted:#5a667a; --line:#dde2ea; --soft:#eaeef4;
  --accent:#2c3e78; --accent-ink:#ffffff;
  --up:#c62b3d; --up-bg:#fbe9eb; --down:#12805c; --down-bg:#e4f4ee; --warn:#a86a00; --warn-bg:#fbf0d9;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","PMingLiU",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#161d28; --ink:#e5eaf2; --muted:#93a0b5; --line:#263041; --soft:#1e2735;
    --accent:#9db0ff; --accent-ink:#0e131b;
    --up:#ff6f7d; --up-bg:#3a1c22; --down:#3ccf95; --down-bg:#123328; --warn:#f0b64a; --warn-bg:#382a10;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --ink:#e5eaf2; --muted:#93a0b5; --line:#263041; --soft:#1e2735;
  --accent:#9db0ff; --accent-ink:#0e131b;
  --up:#ff6f7d; --up-bg:#3a1c22; --down:#3ccf95; --down-bg:#123328; --warn:#f0b64a; --warn-bg:#382a10;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

header.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:14px}
h1{font-family:var(--f-disp);font-size:28px;margin:0;letter-spacing:.02em}
.stamp{color:var(--muted);font-size:12.5px}
.stamp b{color:var(--ink);font-weight:500}

.strip{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stat{flex:1 1 140px;padding:12px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:500;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--muted)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding-block:12px 0;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 15px var(--f-body);padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .c{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-left:5px}

section.panel{padding-top:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 200px;max-width:280px;font:14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13px var(--f-body);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);cursor:pointer;user-select:none;position:sticky;top:0}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px} th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td .nm{font-weight:500} td .cd{color:var(--muted);font-size:12px;margin-right:6px}
.tags{display:flex;gap:4px;flex-wrap:wrap;white-space:normal;min-width:180px;justify-content:flex-end}
td.l .tags{justify-content:flex-start}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink)}
.tag.hot{background:var(--up-bg);color:var(--up)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.st-hit{background:var(--up-bg);color:var(--up)} .tag.st-stop{background:var(--down-bg);color:var(--down)}
.tag.st-run{background:var(--soft)} .tag.st-end{background:var(--warn-bg);color:var(--warn)}
.more{display:block;margin:12px auto 0}

.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.box h3{margin:0 0 10px;font-size:14px}
.cohort td,.cohort th{padding:6px 10px}
svg text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.axis{stroke:var(--line)}

.newscols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-bottom:22px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-bottom:1px solid var(--line)} .news li:last-child{border-bottom:0}
.news .src{color:var(--muted);font-size:12px;display:block}
details.stk{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
details.stk summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.stk summary .c{margin-left:auto;color:var(--muted);font-size:12px}
details.stk .news{padding:0 14px 8px}
.foot{margin-top:28px;color:var(--muted);font-size:12px}
.theme-btn{margin-left:auto}
</style>

<div class="wrap">
  <header class="mast">
    <h1>選股儀表板</h1>

</div>

/* ---------- 通用可排序表格 ---------- */
function sortable(el, cols, rows, opts) {
  let key = opts.sortKey, dir = opts.sortDir, limit = opts.limit || 1e9;
  function draw() {
    const sorted = [...rows()].sort((a,b) => {
      const x = cols.find(c=>c.k===key).v(a), y = cols.find(c=>c.k===key).v(b);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
    });
    const shown = sorted.slice(0, limit);
    el.innerHTML = `<div class="tbl"><table><thead><tr>${cols.map(c =>
      `<th class="${c.l?"l":""}" data-k="${c.k}" aria-sort="${c.k===key?(dir>0?"ascending":"descending"):"none"}">${c.h}</th>`).join("")}</tr></thead>
      <tbody>${shown.map(r => `<tr>${cols.map(c => `<td class="${c.l?"l":""}">${c.r(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${sorted.length > limit ? `<button class="chip more">再顯示更多 (${sorted.length - limit} 筆未顯示)</button>` : ""}
      ${sorted.length === 0 ? `<p class="hint" style="padding:12px">沒有符合的資料。</p>` : ""}`;
    el.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
      const k = th.dataset.k; if (k === key) dir = -dir; else { key = k; dir = cols.find(c=>c.k===k).first || -1; }
      draw();
    }));
    const more = el.querySelector(".more"); if (more) more.addEventListener("click", () => { limit += 200; draw(); });
  }
  draw();
  return { redraw: () => { limit = opts.limit || 1e9; draw(); } };
}

  const bins = Array(edges.length+1).fill(0);
  T.forEach(r => { const v=r["目前報酬(%)"]; if (v==null) return; let i=0; while (i<edges.length && v>=edges[i]) i++; bins[i]++; });
  const labels = ["<-10", ...edges.slice(0,-1).map((e,i)=>`${e}~${edges[i+1]}`), ">10"];
  const W=520,H=210,pl=34,pb=44,pt=10,pr=8, bw=(W-pl-pr)/bins.length, mx=Math.max(...bins,1);
  const ticks=[0,.5,1].map(f=>Math.round(mx*f));
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="報酬分布直方圖">
    ${ticks.map(t=>{const y=pt+(H-pt-pb)*(1-t/mx);return `<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-5}" y="${y+4}" text-anchor="end">${t}</text>`}).join("")}
    ${bins.map((n,i)=>{const h=(H-pt-pb)*n/mx,x=pl+i*bw+3,y=H-pb-h,pos=i>=6;
      return `<rect x="${x}" y="${y}" width="${bw-6}" height="${h}" rx="2" fill="${pos?"var(--up)":"var(--down)"}" opacity=".85"/>
      ${n?`<text x="${x+(bw-6)/2}" y="${y-3}" text-anchor="middle">${n}</text>`:""}
      <text transform="translate(${x+(bw-6)/2},${H-pb+12}) rotate(-40)" text-anchor="end">${labels[i]}</text>`}).join("")}
  </svg>`;

  // 依選股日期分組
  const byDate = {};
  T.forEach(r => (byDate[r["選股日期"]] ||= []).push(r));
  const cohort = Object.keys(byDate).sort().reverse().map(d => {
    const a = byDate[d], v = a.map(r=>r["目前報酬(%)"]).filter(x=>x!=null);
    return `<tr><td class="num">${d}</td><td class="num">${a.length}</td><td class="num ${sgn(mean(v))}">${pct(mean(v))}</td>
      <td class="num">${fmt(v.filter(x=>x>0).length/(v.length||1)*100,0)}%</td><td class="num">${a.filter(r=>r["追蹤狀態"]==="已達壓力").length}</td><td class="num">${a.filter(r=>r["追蹤狀態"]==="已跌破支撐").length}</td></tr>`;
  }).join("");

  P.innerHTML = `<div class="grid2">
    <div class="box"><h3>報酬分布 <span style="font-weight:400;color:var(--muted)">(全部 ${T.length} 筆，每格 2%)</span></h3>${svg}</div>
    <div class="box"><h3>依選股日期</h3><div class="tbl" style="max-height:230px;overflow:auto;border:0"><table class="cohort" style="min-width:420px"><thead><tr><th class="l">選股日</th><th>檔數</th><th>平均報酬</th><th>勝率</th><th>達壓力</th><th>破支撐</th></tr></thead><tbody>${cohort}</tbody></table></div></div></div>
    <div class="tools"><input class="search" id="q2" type="search" placeholder="搜尋代碼或名稱" aria-label="搜尋部位追蹤">
      <button class="chip" data-s="all" aria-pressed="true">全部</button>
      ${statuses.map(s=>`<button class="chip" data-s="${s}" aria-pressed="false">${s} <span class="num">${T.filter(r=>r["追蹤狀態"]===s).length}</span></button>`).join("")}</div>
    <p class="hint">追蹤中＝尚未碰到壓力/支撐且未滿追蹤天數；勝率＝報酬為正的比例。同一檔股票在不同天被選中會各算一筆。</p><div id="t2"></div>`;

  let s = "all";
  const cols = [
    {k:"n", h:"股票", l:1, first:1, v:r=>r["股票代碼"], r:r=>`<span class="cd num">${esc(r["股票代碼"])}</span><span class="nm">${esc(r["股票名稱"])}</span>`},
    {k:"d", h:"選股日", l:1, first:1, v:r=>r["選股日期"], r:r=>`<span class="num">${esc(r["選股日期"])}</span>`},
    {k:"p0", h:"選股價", v:r=>r["選股收盤價"], r:r=>`<span class="num">${fmt(r["選股收盤價"])}</span>`},
    {k:"p1", h:"目前價", v:r=>r["目前收盤價"], r:r=>`<span class="num">${fmt(r["目前收盤價"])}</span>`},
    {k:"ret", h:"報酬", v:r=>r["目前報酬(%)"], r:r=>`<span class="num ${sgn(r["目前報酬(%)"])}">${pct(r["目前報酬(%)"])}</span>`},
    {k:"sup", h:"支撐", v:r=>r["選股時支撐價"], r:r=>`<span class="num">${fmt(r["選股時支撐價"])}</span>`},
    {k:"res", h:"壓力", v:r=>r["選股時壓力價"], r:r=>`<span class="num">${fmt(r["選股時壓力價"])}</span>`},
    {k:"days", h:"天數", v:r=>r["追蹤天數"], r:r=>`<span class="num">${r["追蹤天數"]}</span>`},
    {k:"st", h:"狀態", l:1, first:1, v:r=>r["追蹤狀態"], r:r=>`<span class="tag ${stCls(r["追蹤狀態"])}">${esc(r["追蹤狀態"])}</span>`},
    {k:"up", h:"最後更新", l:1, first:1, v:r=>r["最後更新日期"], r:r=>`<span class="num">${esc(r["最後更新日期"])}</span>`},
  ];
  const rows = () => { const q=$("#q2").value.trim().toLowerCase();
    return T.filter(r => (s==="all"||r["追蹤狀態"]===s) && (!q || (r["股票代碼"]+" "+r["股票名稱"]).toLowerCase().includes(q))); };
  const t = sortable($("#t2"), cols, rows, {sortKey:"ret", sortDir:-1, limit:100});
  $("#q2").addEventListener("input", t.redraw);
  P.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => {
    s = b.dataset.s; P.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", x===b)); t.redraw();
  }));
})();

/* ---------- 新聞 ---------- */
(function(){
  const list = a => a.length ? `<ul class="news">${a.map(n=>`<li><a href="${esc(safeUrl(n.u))}" target="_blank" rel="noopener noreferrer">${esc(n.t)}</a>${n.s?`<span class="src">${esc(n.s)}</span>`:""}</li>`).join("")}</ul>` : `<p class="hint">查無相關新聞。</p>`;
  const stocks = D.picks.map(r => ({code:r["股票代碼"], name:r["股票名稱"], news:D.stockNews[r["股票代碼"]]||[]}));
  $("#p-news").innerHTML = `<div class="newscols">
      <div class="box"><h3>台灣股市 · 近1天</h3>${list(D.market.tw)}</div>
      <div class="box"><h3>美國股市 · 近1天</h3>${list(D.market.us)}</div></div>
    <h3 style="margin:0 0 10px">選股相關新聞 · 近3天</h3>
    <p class="hint">依股票名稱＋「股價」關鍵字搜尋 Google 新聞，極少數可能混入不相關新聞。</p>
    ${stocks.map(s=>`<details class="stk"><summary><span class="cd num" style="color:var(--muted)">${esc(s.code)}</span><b>${esc(s.name)}</b><span class="c">${s.news.length} 則</span></summary>${list(s.news)}</details>`).join("")}`;
})();

$("#foot").textContent = "資料來自每日選股(多)產出的 Excel 與部位追蹤紀錄，僅供個人研究參考，非投資建議。這是產生當下的快照，不會自動更新。";
try { const t = localStorage.getItem("dash-tab"); if (t) { const b = document.querySelector(`.tab[data-t="${t}"]`); if (b) b.click(); } } catch(e) {}
</script>
